# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src", "docs"]

[processor.zspell]
src_dirs = ["src", "docs"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.requirements]
src_dirs = ["src", "scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "docs", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

[processor.eslint]
src_dirs = ["config"]
args = ["-c", "config/eslint.config.js"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile compiled src/**/*.c (-fpic) into out/lib/libfastlog.so, then
# built each test/*.c against that library (-lfastlog -lpthread). That is a
# multi-object shared-library link with a lib-before-tests order, which the
# single-file C processor cannot express, so scripts/build_fastlog.py runs the
# exact sequence. The .c/.h sources are the inputs so a change retriggers it.
[processor.explicit.fastlog]
command = "scripts/build_fastlog.py"
input_globs = ["src/**/*.c", "src/**/*.h", "test/*.c"]
output_files = [
    "out/lib/libfastlog.so",
    "out/bin/fastlog_test_basic",
    "out/bin/fastlog_test_speed",
    "out/bin/fastlog_test_crash",
]

# us_helper.h includes cpufreq.h, provided by libcpufreq-dev.
[dependencies]
system = [
    "libcpufreq-dev",
]
